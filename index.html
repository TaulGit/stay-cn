<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#050505" />
  <title>Stay? · 中文完整剧情</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050505;
      --ink: #e9e9e9;
      --muted: #8d8d8d;
      --line: #252525;
      --accent: #d5b47a;
      --accent-soft: rgba(213, 180, 122, 0.14);
      --panel: rgba(18, 18, 18, 0.97);
    }

    * { box-sizing: border-box; }

    html, body {
      min-height: 100%;
      margin: 0;
      background: var(--bg);
    }

    body {
      display: grid;
      place-items: center;
      overflow-x: hidden;
      font-family: Georgia, "Noto Serif SC", "Songti SC", serif;
      color: var(--ink);
    }

    button {
      border: 0;
      font: inherit;
      color: inherit;
      cursor: pointer;
    }

    .game-shell {
      position: relative;
      width: min(100vw, 900px);
      min-height: 100vh;
      padding: 24px clamp(18px, 5vw, 54px) 30px;
      display: flex;
      flex-direction: column;
      isolation: isolate;
    }

    .game-shell::before {
      content: "";
      position: fixed;
      inset: 50% auto auto 50%;
      width: min(74vw, 620px);
      aspect-ratio: 1;
      transform: translate(-50%, -50%);
      border: 1px solid rgba(255, 255, 255, 0.035);
      border-radius: 50%;
      box-shadow: 0 0 0 26px rgba(255, 255, 255, 0.012),
                  0 0 0 52px rgba(255, 255, 255, 0.008);
      pointer-events: none;
      z-index: -1;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 32px;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .chapter {
      color: var(--accent);
      white-space: nowrap;
    }

    .controls {
      display: flex;
      gap: 14px;
      align-items: center;
    }

    .control {
      padding: 3px 0;
      color: var(--muted);
      background: transparent;
      font: inherit;
      letter-spacing: 0.08em;
      transition: color 160ms ease;
    }

    .control:hover,
    .control:focus-visible {
      color: var(--ink);
      outline: none;
    }

    .screen {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 46px 0 70px;
    }

    .view {
      width: min(100%, 690px);
      animation: appear 500ms cubic-bezier(.22, 1, .36, 1) both;
    }

    .view[hidden] { display: none; }

    .wake-view {
      display: grid;
      place-items: center;
      gap: 26px;
      text-align: center;
    }

    .wake-mark {
      position: relative;
      width: 88px;
      aspect-ratio: 1;
      border: 1px solid rgba(213, 180, 122, 0.44);
      border-radius: 50%;
      transform: rotate(-12deg);
      opacity: 0.82;
    }

    .wake-mark::before,
    .wake-mark::after {
      content: "";
      position: absolute;
      inset: 13px;
      border: 1px dashed rgba(213, 180, 122, 0.34);
      border-radius: 50%;
    }

    .wake-mark::after {
      inset: 42px 10px;
      border: 0;
      border-top: 1px solid var(--accent);
      transform: rotate(90deg);
    }

    .wake-button {
      min-width: 184px;
      padding: 18px 28px 17px;
      background: transparent;
      border: 1px solid var(--line);
      color: var(--ink);
      font-size: clamp(24px, 4vw, 30px);
      letter-spacing: 0.18em;
      text-indent: 0.18em;
      transition: border-color 180ms ease, background 180ms ease,
                  color 180ms ease, transform 180ms ease;
    }

    .wake-button:hover,
    .wake-button:focus-visible {
      border-color: rgba(213, 180, 122, 0.68);
      background: var(--accent-soft);
      color: #fff7e7;
      outline: none;
      transform: translateY(-2px);
    }

    .wake-hint {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.08em;
    }

    .scene-view {
      display: grid;
      gap: 24px;
    }

    .scene-kicker {
      margin: 0;
      color: var(--accent);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      letter-spacing: 0.16em;
    }

    .scene-title {
      margin: -6px 0 0;
      color: #f0f0f0;
      font-size: clamp(24px, 4vw, 31px);
      font-weight: 600;
      line-height: 1.25;
    }

    .scene-title[hidden],
    .scene-kicker[hidden] { display: none; }

    .story-copy {
      display: grid;
      gap: 20px;
      color: #d6d6d6;
      font-size: clamp(17px, 2.4vw, 20px);
      line-height: 1.95;
    }

    .story-copy p { margin: 0; }

    .story-copy .detail {
      color: #a7a7a7;
      font-size: 0.92em;
    }

    .story-copy .quote {
      padding-left: 16px;
      border-left: 1px solid rgba(213, 180, 122, 0.45);
      color: #e4e4e4;
    }

    .story-copy .choice-record {
      margin: -5px 0;
    }

    .choices {
      display: grid;
      gap: 10px;
      padding-top: 4px;
    }

    .choice {
      position: relative;
      width: 100%;
      padding: 14px 18px 13px 28px;
      background: transparent;
      border: 1px solid rgba(233, 233, 233, 0.22);
      color: #e2e2e2;
      font-size: 16px;
      line-height: 1.5;
      text-align: left;
      transition: color 160ms ease, border-color 160ms ease,
                  background 160ms ease, padding-left 160ms ease;
    }

    .choice::before {
      content: "›";
      position: absolute;
      left: 11px;
      color: var(--accent);
      opacity: 0;
      transform: translateX(-4px);
      transition: opacity 160ms ease, transform 160ms ease;
    }

    .choice:hover,
    .choice:focus-visible {
      padding-left: 32px;
      border-color: rgba(213, 180, 122, 0.72);
      background: rgba(255, 255, 255, 0.025);
      color: #fff;
      outline: none;
    }

    .choice:hover::before,
    .choice:focus-visible::before {
      opacity: 1;
      transform: translateX(0);
    }

    .choice.selected {
      border-color: rgba(213, 180, 122, 0.62);
      border-left: 2px solid var(--accent);
      background: rgba(255, 255, 255, 0.025);
      color: #fff;
    }

    .choice.selected::before { display: none; }

    .choice[disabled] {
      cursor: default;
      opacity: 0.52;
    }

    .choice-record {
      position: relative;
      margin: -6px 0;
      padding-left: 16px;
      border-left: 2px solid var(--accent);
      color: #b7b7b7;
      font-size: 0.92em;
      font-style: italic;
    }

    .route-card {
      display: grid;
      gap: 6px;
      margin: -4px 0 2px;
      padding: 13px 15px;
      border: 1px solid rgba(213, 180, 122, 0.24);
      background: rgba(213, 180, 122, 0.05);
    }

    .route-card strong {
      color: #f1dfbd;
      font-size: 15px;
      letter-spacing: 0.08em;
    }

    .route-card span {
      color: #a9a9a9;
      font-size: 14px;
      line-height: 1.65;
    }

    .status {
      min-height: 18px;
      margin: 0;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 10px;
      letter-spacing: 0.08em;
      text-align: right;
    }

    .clue-panel {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.76);
    }

    .clue-panel[hidden] { display: none; }

    .clue-card {
      width: min(100%, 580px);
      max-height: min(82vh, 720px);
      overflow: auto;
      padding: 24px clamp(20px, 4vw, 34px) 28px;
      border: 1px solid rgba(213, 180, 122, 0.38);
      background: var(--panel);
      box-shadow: 0 22px 80px rgba(0, 0, 0, 0.6);
    }

    .clue-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    .clue-head h2 {
      margin: 0;
      color: #f1dfbd;
      font-size: 20px;
      font-weight: 600;
    }

    .clue-close {
      padding: 2px 0;
      background: transparent;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      letter-spacing: 0.1em;
    }

    .clue-close:hover,
    .clue-close:focus-visible { color: var(--ink); outline: none; }

    .clue-meta {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .clue-list {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .clue-item {
      display: grid;
      grid-template-columns: 18px 1fr;
      gap: 8px;
      align-items: start;
      padding: 9px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      color: #b9b9b9;
      font-size: 14px;
      line-height: 1.55;
    }

    .clue-item::before {
      content: "○";
      color: #555;
    }

    .clue-item.known { color: #eee; }
    .clue-item.known::before { content: "●"; color: var(--accent); }

    .clue-foot {
      margin: 20px 0 0;
      color: #8f8f8f;
      font-size: 13px;
      line-height: 1.7;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(9px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 520px) {
      .game-shell { padding-top: 18px; }
      .controls { gap: 10px; }
      .screen { padding-top: 30px; }
      .scene-view { gap: 21px; }
      .story-copy { line-height: 1.82; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 1ms !important;
        transition-duration: 1ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="game-shell" aria-label="Stay? 中文完整剧情">
    <header class="topbar">
      <span class="chapter" id="chapterLabel">INK</span>
      <nav class="controls" aria-label="游戏控制">
        <button class="control" id="saveButton" type="button">保存</button>
        <button class="control" id="loadButton" type="button">读取</button>
        <button class="control" id="clueButton" type="button">线索</button>
        <button class="control" id="restartButton" type="button">重来</button>
      </nav>
    </header>

    <section class="screen" aria-live="polite">
      <section class="view wake-view" id="wakeView" aria-labelledby="wakeTitle">
        <div class="wake-mark" aria-hidden="true"></div>
        <button class="wake-button" id="wakeButton" type="button" aria-describedby="wakeHint">
          <span id="wakeTitle">醒来</span>
        </button>
        <p class="wake-hint" id="wakeHint">每一轮都会从这里开始。</p>
      </section>

      <section class="view scene-view" id="sceneView" hidden aria-labelledby="sceneTitle">
        <p class="scene-kicker" id="sceneKicker" hidden></p>
        <h1 class="scene-title" id="sceneTitle" hidden></h1>
        <div class="story-copy" id="storyCopy"></div>
        <div class="choices" id="choices" role="group" aria-label="选择"></div>
      </section>
    </section>

    <p class="status" id="status" role="status" aria-live="polite"></p>
  </main>

  <aside class="clue-panel" id="cluePanel" hidden aria-labelledby="clueTitle">
    <div class="clue-card" role="dialog" aria-modal="true">
      <div class="clue-head">
        <h2 id="clueTitle">已知线索</h2>
        <button class="clue-close" id="clueClose" type="button">关闭</button>
      </div>
      <p class="clue-meta" id="clueMeta"></p>
      <ul class="clue-list" id="clueList"></ul>
      <p class="clue-foot">知识会随循环保留；人物关系和当轮行动只影响当前人生。</p>
    </div>
  </aside>

  <script>
    (() => {
      const STORAGE_KEY = 'stay-complete-cn-v1';
      const wakeView = document.getElementById('wakeView');
      const sceneView = document.getElementById('sceneView');
      const wakeButton = document.getElementById('wakeButton');
      const wakeTitle = document.getElementById('wakeTitle');
      const wakeHint = document.getElementById('wakeHint');
      const chapterLabel = document.getElementById('chapterLabel');
      const sceneKicker = document.getElementById('sceneKicker');
      const sceneTitle = document.getElementById('sceneTitle');
      const storyCopy = document.getElementById('storyCopy');
      const choices = document.getElementById('choices');
      const status = document.getElementById('status');
      const cluePanel = document.getElementById('cluePanel');
      const clueMeta = document.getElementById('clueMeta');
      const clueList = document.getElementById('clueList');

      const openingParagraph = '晨光斜斜地从你二楼宿舍的窗户照进来，照亮了你成摞的书、祖母的被子，还有室友那头凌乱的卷发。室友静静地躺在床上，睁着眼睛盯着天花板，仿佛那里藏着一个秘密，正等着被说出来。';
      const tracks = [
        {
          id: 'magic',
          label: '“我喜欢魔法，可我不知道自己能不能应付那些必修的学术课程……”',
          name: '魔法',
          summary: '学习遗物、咒语与意志，进入彭特先生的魔法店。',
        },
        {
          id: 'combat',
          label: '“我可不想整天困在图书馆或档案室里。谁在乎那些东西？给我一把剑、一匹马，再给我一个职位。”',
          name: '战斗',
          summary: '接受训练并驻守菲奥雷水坝，调查湖底遗址。',
        },
        {
          id: 'history',
          label: '“我想弄清我们从哪里来、是怎样走到今天的，也想知道该如何从过去吸取教训。我要选历史方向。”',
          name: '历史',
          summary: '在档案馆研究凤凰宝石和治愈南方的遗物。',
        },
      ];

      const reactionChoices = [
        { id: 'okay', label: '“呃，好吧。”' },
        { id: 'bud', label: '“老兄，你的羞涩都去哪儿了？没人告诉我，你一直把一个满嘴讥讽的混蛋藏在里面。”' },
      ];
      const dayChoice = { id: 'school', label: '为今天做好准备，去学校。' };
      const appearanceChoices = [
        { id: 'lad', label: '一个矮个男孩' },
        { id: 'woman', label: '一个瘦长的年轻女人' },
        { id: 'freckles', label: '一个满脸雀斑的人' },
      ];
      const trackPrompt = '“嗯。”岑说，语气干涩如盐。“真令人震惊。”';
      const smockParagraph = '岑套上一件你很确定来自她脏衣篮的罩衫，走出了房间。';

      const clueCatalog = [
        ['loopStone', '乔给过你一件能把人带回这一天的遗物。'],
        ['comet', '彗星会毁灭世界，但存在阻止它的方法。'],
        ['phoenixClue', '凤凰宝石藏在城门石狮的头中。'],
        ['lionInscription', '石狮下方刻着古语。'],
        ['protectWord', '真正要使用的古语是“保护”，不是“毁灭”。'],
        ['verisWater', '菲奥雷水下有一只怪物，黑暗魔力正在污染水系。'],
        ['verisName', '怪物名叫维丽丝，她曾经许愿保护自己的城市。'],
        ['suzetteDanger', '苏泽特可能在舞会上释放危险的黑暗魔法。'],
        ['southernClue', '南方土地正在枯萎，歉收会把人们推向战争。'],
      ];

      const routeCards = {
        magic: { name: '魔法路线', summary: '遗物、古语、许愿魔法与维丽丝的名字。' },
        combat: { name: '战斗路线', summary: '菲奥雷水坝、奥萨妮、幽灵传说与石狮古语。' },
        history: { name: '历史路线', summary: '档案馆、凤凰宝石与治愈土地的遗物。' },
      };

      const state = createInitialState();

      function createInitialState() {
        return {
          scene: 'wake',
          loop: 0,
          track: null,
          reaction: null,
          day: null,
          appearance: null,
          returnScene: null,
          transcript: [],
          knowledge: [],
          detail: null,
          flags: {
            joTrust: false,
            mykaLab: false,
            mykaRelation: null,
            estebanArt: false,
            suzetteFiles: false,
            suzetteCalm: false,
            ancientTongue: false,
            protectWord: false,
            verisName: false,
            verisWish: false,
            southernClue: false,
            damBlown: false,
            gem: false,
            healingRelic: false,
            verisRest: false,
            southHealed: false,
            cometProtected: false,
          },
        };
      }

      function textOf(item) {
        return typeof item === 'string' ? item : item.text;
      }

      function normalize(value) {
        return String(value || '')
          .replace(/[“”"‘’'\s。，、！？!?：:；;…·]/g, '')
          .toLowerCase();
      }

      function addKnowledge(id) {
        if (!state.knowledge.includes(id)) state.knowledge.push(id);
      }

      function setDetail(scene, text) {
        state.detail = { scene, text };
      }

      function sceneDetail(scene) {
        return state.detail && state.detail.scene === scene ? [{ text: state.detail.text, className: 'detail' }] : [];
      }

      function makeChoice(id, label, next, action, extra = {}) {
        return { id, label, next, action, ...extra };
      }

      function trackChoices() {
        const list = tracks.map((track) => makeChoice(
          `track-${track.id}`,
          track.label,
          'track_reaction',
          () => { state.track = track.id; },
        ));
        list.push(makeChoice(
          'campus',
          '不回想，直接出门，去行政楼前的空地看看。',
          'campus',
          () => { state.returnScene = state.scene; },
        ));
        if (state.knowledge.length) {
          list.push(makeChoice(
            'remember',
            '回想我已经知道的事。',
            'memory',
            () => { state.returnScene = state.scene; },
          ));
        }
        return list;
      }

      function routeHubChoices(route) {
        const list = [];
        if (route === 'magic') {
          list.push(
            makeChoice('pent', '去彭特先生的魔法店工作。', 'magic_pent'),
            makeChoice('myka', '去迈卡的实验室看看。', 'magic_myka'),
            makeChoice('suzette', '和苏泽特谈谈她的研究。', 'magic_suzette'),
            makeChoice('dance', '参加市长举办的舞会。', 'dance'),
          );
        }
        if (route === 'combat') {
          list.push(
            makeChoice('ossani', '去找水坝守卫奥萨妮。', 'combat_ossani'),
            makeChoice('night', '夜里去调查水坝。', 'combat_night'),
            makeChoice('warehouse', '调查储存炸药的仓库。', 'combat_warehouse'),
            makeChoice('warMyka', '去迈卡的研究帐篷帮忙。', 'combat_myka'),
          );
        }
        if (route === 'history') {
          list.push(
            makeChoice('archive', '在档案馆研究遗物和古代文献。', 'history_archive'),
            makeChoice('graduation', '查看毕业日的安排。', 'history_graduation'),
            makeChoice('relic', '调查档案馆后室的治愈遗物。', 'history_relic'),
            makeChoice('esteban', '和埃斯特班聊聊他想画的东西。', 'history_esteban'),
          );
        }
        list.push(
          makeChoice('room', '去苏泽特的房间绕一下。', 'room_intro', () => { state.returnScene = `${route}_hub`; }),
          makeChoice('campus', '回到校园空地，看看其他同学。', 'campus', () => { state.returnScene = `${route}_hub`; }),
          makeChoice('memory', '回想这一轮已经掌握的线索。', 'memory', () => { state.returnScene = `${route}_hub`; }),
          makeChoice('finish', '结束这一轮，看看世界会怎样。', 'loop_end'),
        );
        return list;
      }

      const scenes = {
        story: () => ({
          kicker: '埃莱亚大学 · 第一天',
          title: '宿舍清晨',
          paragraphs: [openingParagraph],
          choices: [
            makeChoice('speak', '“嘿，你还好吗，岑？”', 'continuation_speak'),
            makeChoice('leave', '让她静静待着。', 'continuation_leave'),
          ],
        }),

        continuation_speak: () => ({
          kicker: '宿舍 · 早晨',
          paragraphs: [
            '岑转过来看你，脸上勉强挤出一点笑意。“大日子。”',
            '“……嗯？”',
            '岑撑起身子坐起来，把两条瘦削的腿晃下床，皱着眉看着它们。“天哪，我真瘦。”站起身时，岑瞥了你一眼。“你决定好要选哪个方向了吗？今天就是决定的日子。”',
          ],
          choices: trackChoices(),
        }),

        continuation_leave: () => ({
          kicker: '宿舍 · 早晨',
          paragraphs: [
            '听见你起身，岑撑起身子坐起来，把两条瘦削的腿晃下床，皱着眉看着它们。“天哪，我真瘦。”站起身时，岑瞥了你一眼。“你决定好要选哪个方向了吗？今天就是决定的日子。”',
          ],

        ending_south_only: () => ({
          kicker: '结局 F · 只治愈南方',
          title: '南方的和平',
          paragraphs: [
            '南方的土地恢复，战争没有发生。你在海边或农场找到了一段和平生活，却没有赶回高塔。彗星仍然是尚未解决的末日威胁。',
          ],
          choices: [
            makeChoice('again', '回到下一轮，继续寻找完整答案。', null, null, { special: 'newLoop' }),
            makeChoice('guide', '查看推荐的真结局流程。', 'guide'),
          ],
        }),
      };

      function getScene(id) {
        if (id.startsWith('ending_')) {
          addKnowledge('loopStone');
          addKnowledge('comet');
        }
        return scenes[id] ? scenes[id](state) : scenes.ending_unchanged(state);
      }

      function appendScene(id, choiceLabel) {
        const definition = getScene(id);
        const paragraphs = definition.paragraphs || [];
        const needle = normalize(choiceLabel);
        const echoIndex = choiceLabel
          ? paragraphs.findIndex((paragraph) => normalize(textOf(paragraph)).includes(needle))
          : -1;
        if (choiceLabel && echoIndex < 0) {
          state.transcript.push({ text: choiceLabel, className: 'choice-record' });
        }
        paragraphs.forEach((paragraph, index) => {
          const item = typeof paragraph === 'string' ? { text: paragraph } : { ...paragraph };
          if (index === echoIndex) {
            item.className = [item.className, 'choice-record'].filter(Boolean).join(' ');
          }
          state.transcript.push(item);
        });
      }

      function renderParagraphs() {
        storyCopy.replaceChildren(...state.transcript.map((item) => {
          const paragraph = document.createElement('p');
          paragraph.textContent = textOf(item);
          if (item.className) paragraph.className = item.className;
          return paragraph;
        }));
      }

      function renderChoices(definition) {
        choices.replaceChildren(...(definition.choices || []).map((choice) => {
          const button = document.createElement('button');
          button.className = 'choice';
          button.type = 'button';
          button.dataset.choice = choice.id;
          button.textContent = choice.label;
          if (choice.disabled) button.disabled = true;
          return button;
        }));
      }

      function renderScene() {
        const definition = getScene(state.scene);
        wakeView.hidden = state.scene !== 'wake';
        sceneView.hidden = state.scene === 'wake';
        chapterLabel.textContent = 'INK';
        wakeTitle.textContent = state.loop ? '再次醒来' : '醒来';
        wakeHint.textContent = state.loop ? `第 ${state.loop + 1} 轮 · 记忆仍在。` : '每一轮都会从这里开始。';
        if (state.scene === 'wake') return;
        sceneKicker.textContent = definition.kicker || '';
        sceneKicker.hidden = !definition.kicker;
        sceneTitle.textContent = definition.title || '';
        sceneTitle.hidden = !definition.title;
        renderParagraphs();
        renderChoices(definition);
        window.setTimeout(() => choices.querySelector('.choice')?.focus(), 70);
      }

      function transition(next, choiceLabel) {
        const target = typeof next === 'function' ? next(state) : next;
        if (!target || !scenes[target]) return;
        state.scene = target;
        appendScene(target, choiceLabel);
        state.detail = null;
        renderScene();
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
      }

      function startLoop() {
        const persistentFlagKeys = ['ancientTongue', 'protectWord', 'verisName', 'verisWish'];
        const preservedFlags = Object.fromEntries(
          persistentFlagKeys.map((key) => [key, Boolean(state.flags[key])]),
        );
        const preservedKnowledge = [...state.knowledge];
        const nextLoop = state.loop + 1;
        Object.assign(state, createInitialState(), {
          loop: nextLoop,
          flags: {
            ...createInitialState().flags,
            ...preservedFlags,
            southernClue: preservedKnowledge.includes('southernClue'),
          },
          knowledge: preservedKnowledge,
        });
        renderScene();
        wakeButton.focus();
        setStatus(`第 ${nextLoop + 1} 轮开始`);
      }

      function choose(id) {
        const definition = getScene(state.scene);
        const choice = (definition.choices || []).find((item) => item.id === id);
        if (!choice || choice.disabled) return;
        if (choice.special === 'newLoop') {
          startLoop();
          return;
        }
        if (choice.action) choice.action(state);
        transition(choice.next, choice.label);
      }

      function goToStory() {
        transition('story');
      }

      function restart() {
        Object.assign(state, createInitialState());
        renderScene();
        wakeButton.focus();
        setStatus('已重来');
      }

      function setStatus(message) {
        status.textContent = message;
        window.clearTimeout(setStatus.timer);
        setStatus.timer = window.setTimeout(() => { status.textContent = ''; }, 2200);
      }

      function save() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          setStatus('已保存当前进度');
        } catch (error) {
          setStatus('浏览器不允许保存');
        }
      }

      function load() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
          if (!saved || !scenes[saved.scene]) {
            setStatus('还没有可读取的记录');
            return;
          }
          const fresh = createInitialState();
          Object.assign(state, fresh, saved);
          state.flags = { ...fresh.flags, ...(saved.flags || {}) };
          state.knowledge = Array.isArray(saved.knowledge) ? saved.knowledge.filter((id) => clueCatalog.some(([key]) => key === id)) : [];
          state.transcript = Array.isArray(saved.transcript) ? saved.transcript.filter((item) => item && typeof item.text === 'string') : [];
          if (!Number.isInteger(state.loop) || state.loop < 0) state.loop = 0;
          renderScene();
          setStatus('已读取记录');
        } catch (error) {
          setStatus('读取记录失败');
        }
      }

      function renderClues() {
        clueMeta.textContent = `第 ${state.loop + 1} 轮 · 已发现 ${state.knowledge.length} / ${clueCatalog.length} 条线索`;
        clueList.replaceChildren(...clueCatalog.map(([id, text]) => {
          const item = document.createElement('li');
          item.className = `clue-item${state.knowledge.includes(id) ? ' known' : ''}`;
          item.textContent = text;
          return item;
        }));
      }

      function toggleClues(open) {
        const visible = typeof open === 'boolean' ? open : cluePanel.hidden;
        cluePanel.hidden = !visible;
        if (visible) {
          renderClues();
          document.getElementById('clueClose').focus();
        }
      }

      wakeButton.addEventListener('click', goToStory);
      choices.addEventListener('click', (event) => {
        const button = event.target.closest('[data-choice]');
        if (button) choose(button.dataset.choice);
      });
      document.getElementById('restartButton').addEventListener('click', restart);
      document.getElementById('saveButton').addEventListener('click', save);
      document.getElementById('loadButton').addEventListener('click', load);
      document.getElementById('clueButton').addEventListener('click', () => toggleClues(true));
      document.getElementById('clueClose').addEventListener('click', () => toggleClues(false));
      cluePanel.addEventListener('click', (event) => {
        if (event.target === cluePanel) toggleClues(false);
      });

      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') {
          if (!cluePanel.hidden) toggleClues(false);
          else restart();
        }
        if (state.scene === 'wake' && (event.key === 'Enter' || event.key === ' ')) {
          event.preventDefault();
          goToStory();
        }
      });

      renderScene();
    })();
  </script>
