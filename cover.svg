<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Stay? 中文完整剧情</title>
  <desc id="desc">黑底文字冒险游戏封面，带有黄色竖线和中文标题。</desc>
  <rect width="1200" height="630" fill="#050505"/>
  <rect x="92" y="90" width="6" height="450" fill="#f2c94c"/>
  <text x="142" y="250" fill="#f4f4f4" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="76" font-weight="700">Stay?</text>
  <text x="146" y="330" fill="#f2c94c" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="40" font-weight="600">中文完整剧情</text>
  <text x="146" y="405" fill="#b8b8b8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="26">选择 · 记忆 · 循环 · 结局</text>
